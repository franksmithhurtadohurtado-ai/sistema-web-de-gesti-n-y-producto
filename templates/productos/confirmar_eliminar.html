{% extends "base.html" %}
{% block title %}Eliminar producto · PedidoFácil{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-danger">Eliminar producto</h1>
        <p>¿Seguro que quieres eliminar <strong>{{ object.nombre }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <a href="{% url 'productos:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
